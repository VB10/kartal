name: kartal
description: Kartal is an extension package for easy to use at app development
  time. You can access more features with primitive variables(context, string
  etc.).
version: 5.0.0
issue_tracker: https://github.com/vb10/kartal/issues
repository: https://github.com/VB10/kartal
topics:
  - extension
  - utility
  - context
  - color
  - validation
screenshots:
  - description: 'City of Kartal, Istanbul'
    path: github/screen/kartal.jpeg

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  collection: ^1.19.1
  device_info_plus: ^13.2.0
  diacritic: ^0.1.6
  dio: ^5.11.0
  flutter:
    sdk: flutter
  html: ^0.15.6
  logger: ^2.7.0
  mask_text_input_formatter: ^2.9.0
  mime: ^2.0.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  # Capped by the `meta` version that flutter_test pins from the SDK: Flutter
  # 3.38.1 (our floor) pins meta 1.17.0, while mockito >=5.7.0 pulls analyzer
  # 13, which wants meta ^1.18.0. Raise once the floor moves.
  mockito: ^5.6.4
  # 10.1.0 is the newest release whose own constraint (^3.10.0) admits the Dart
  # version this package claims to support. 10.2.0 needs 3.11 and 10.3.0 needs
  # 3.12, so a `^10.3.0` lower bound made `pub get` unsolvable on the declared
  # floor. The caret still lets a newer SDK pick up 10.3.0.
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true

scripts:
  publish: flutter pub publish
  publish-dry-run: flutter pub publish --dry-run