name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a Flutter release cannot turn CI red without a commit here.
  FLUTTER_VERSION: "3.38.1"

jobs:
  analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage

      - name: Check coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 85
          # These need a real device or a plugin channel, so they are
          # unreachable from VM tests and would cap the achievable total.
          exclude: >-
            **/private/platform/app_platform.dart
            **/private/platform/web_platform.dart
            **/utility/device/device_utils_io.dart
            **/utility/device/device_utils_web.dart
            **/private/file/web_file_extension.dart
            **/private/mixin/string/string_platform_mixin.dart
            **/private/mixin/string/string_share_mixin.dart

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  package:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate the package
        run: flutter pub publish --dry-run

  example:
    name: Build example (web + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      # Proves the package:web migration actually compiles for the web,
      # including the wasm target that dart:html could never satisfy.
      - name: Build web
        working-directory: example
        run: flutter build web --release

      - name: Build wasm
        working-directory: example
        run: flutter build web --wasm --release
