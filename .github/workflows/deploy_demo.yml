name: Deploy demo

# Publishes the example gallery to GitHub Pages on every push to master, so
# the live demo never drifts from the code it documents.
#
# One time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". No gh-pages branch is needed.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Only one deployment at a time, and let a newer push supersede an in-flight
# one rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: "3.38.1"

jobs:
  build:
    name: Build gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Smoke test the gallery
        working-directory: example
        run: flutter test

      # base-href must match the repository name, because Pages serves the
      # site from /kartal/ rather than the domain root.
      - name: Build web
        working-directory: example
        run: flutter build web --release --base-href /kartal/

      - name: Add a 404 fallback
        working-directory: example
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
